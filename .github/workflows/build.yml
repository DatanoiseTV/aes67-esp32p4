name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ESP-IDF ${{ matrix.idf }} / esp32p4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [v5.5]
    steps:
      - uses: actions/checkout@v4
      - name: Build example firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32p4
          command: idf.py build
